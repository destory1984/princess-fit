<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Refit 관리</title>
    <!--
      The desk, as one page.

      Deliberately not a second app. Refit is Expo and React Native; standing
      up Next.js beside it to read one table would double the toolchain that
      has to keep working, for a screen one person opens.

      It lives in public/, which Expo serves at the web root, so it is at
      /admin.html beside the app in development and in any web build — the
      place someone would guess. It is also a plain file that opens by being
      double-clicked, with no server at all.

      There is no secret in here. The anon key is public by design and every
      question of who may read what is answered by row level security — the
      admins table decides, and the database enforces it whatever this page
      believes about itself.
    -->
    <style>
      :root {
        --bg: #f4ece0;
        --surface: #fbf6ee;
        --border: #e2d5c2;
        --text: #3b2f26;
        --dim: #8a7a6a;
        --accent: #9c2b2b;
        --good: #3f7d54;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      h1 { font-size: 18px; margin: 0; }
      .who { color: var(--dim); font-size: 13px; margin-left: auto; }
      main { max-width: 900px; margin: 0 auto; padding: 24px; }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 12px;
      }
      label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 4px; }
      input, textarea, select, button {
        font: inherit;
        border-radius: 8px;
        border: 1px solid var(--border);
        padding: 9px 12px;
        background: #fff;
        color: var(--text);
      }
      input, textarea { width: 100%; }
      button { cursor: pointer; background: var(--surface); }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .grow { flex: 1; min-width: 200px; }
      .name { font-size: 16px; font-weight: 700; }
      .meta { color: var(--dim); font-size: 13px; }
      .tag {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--dim);
      }
      .tag.new { border-color: var(--accent); color: var(--accent); }
      .tag.added { border-color: var(--good); color: var(--good); }
      .note { margin-top: 6px; white-space: pre-wrap; }
      .empty { color: var(--dim); padding: 24px 0; }
      .error { color: var(--accent); }
      .filters { margin-bottom: 16px; }
      .filters button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <h1>Refit 관리</h1>
      <span class="who" id="who"></span>
    </header>
    <main id="main"><p class="empty">불러오는 중…</p></main>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
      import { filterUsers, pageOf } from './adminList.js';

      /*
        Read from the page's own query string on first run and then kept, so
        the file stays free of one project's details and can be opened against
        another without editing it:

          /admin.html?url=https://xxx.supabase.co&key=eyJ...
      */
      const params = new URLSearchParams(location.search);
      const url = params.get('url') || localStorage.getItem('refit.url');
      const key = params.get('key') || localStorage.getItem('refit.key');
      if (params.get('url')) localStorage.setItem('refit.url', params.get('url'));
      if (params.get('key')) localStorage.setItem('refit.key', params.get('key'));

      const main = document.getElementById('who');
      const body = document.getElementById('main');

      // Everything below is inside a function so a missing key can simply
      // return. Throwing at the top level stops the script just as well and
      // leaves a red line in the console, which reads as a fault rather than
      // as the page waiting to be told where to look.
      if (!url || !key) {
        body.innerHTML = `<div class="card">
          <p>Supabase 주소와 anon key가 필요해요. 주소창에 한 번만 붙여 주세요:</p>
          <p class="meta">/admin.html?url=https://xxx.supabase.co&amp;key=eyJ...</p>
          <p class="meta">앱의 .env에 있는 EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY 예요.</p>
        </div>`;
      } else {
        run(url, key);
      }

      function run(url, key) {
      const db = createClient(url, key);
      const STATUS = {
        new: '기다리는 중',
        seen: '읽음',
        added: '넣었음',
        declined: '안 넣음',
      };
      let filter = 'new';
      let tab = 'requests';
      // Which person's card is open. One at a time: the point is to read one
      // person's last few sessions, not to skim everybody's at once.
      let opened = null;
      // The users tab keeps what admin_users() returned, so typing in the
      // search box or turning a page cuts the same list again instead of
      // asking the database for it. Cleared on entering the tab and after
      // anything that changes a row.
      let users = null;
      let recent = null;
      let query = '';
      let page = 1;
      const PER_PAGE = 20;

      const escape = (s) =>
        String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      async function start() {
        const { data } = await db.auth.getSession();
        if (!data.session) return signIn();

        main.textContent = data.session.user.email;

        /*
          Asked of the database, not assumed: this page has no authority of
          its own. Through a function rather than by reading the table,
          because the policy guarding that table has to ask the same question
          and would be asking it of itself.

          The two failures are told apart. They used to share a branch, so a
          broken policy and a plain non-admin both produced 「관리자가 아니에요」
          — which is a lie half the time and unfixable either way.
        */
        const { data: allowed, error } = await db.rpc('is_admin');
        if (error) {
          body.innerHTML = `<div class="card">
            <p class="error">관리자인지 확인하지 못했어요.</p>
            <p class="meta">${escape(error.message)}</p>
            <p class="meta">supabase/admin.sql을 다시 한 번 실행해 주세요. is_admin() 함수가 필요해요.</p>
            <p><button id="out">로그아웃</button></p>
          </div>`;
          document.getElementById('out').onclick = async () => {
            await db.auth.signOut();
            location.reload();
          };
          return;
        }
        if (!allowed) {
          body.innerHTML = `<div class="card">
            <p>이 계정은 관리자가 아니에요.</p>
            <p class="meta">SQL 편집기에서 한 줄 넣어 주세요:</p>
            <p class="meta">insert into admins (user_id) select id from auth.users where email = '${escape(data.session.user.email)}' on conflict (user_id) do nothing;</p>
            <p><button id="out">로그아웃</button></p>
          </div>`;
          document.getElementById('out').onclick = async () => {
            await db.auth.signOut();
            location.reload();
          };
          return;
        }

        await render();
      }

      /*
        Two desks behind one page. Kept as a variable rather than as routes
        because the whole thing is one file and a hash router for two lists
        would be more machinery than either list has.
      */
      async function render() {
        const tabs = `<div class="row filters">
          <button data-tab="requests" aria-pressed="${tab === 'requests'}">운동 요청</button>
          <button data-tab="users" aria-pressed="${tab === 'users'}">사용자</button>
        </div>`;
        body.innerHTML = tabs + '<p class="empty">불러오는 중…</p>';
        const rest = tab === 'requests' ? await requestsView() : await usersView();
        // Re-rendering replaces the search box, so the caret would be lost
        // after every letter. Put it back where it was.
        const typing = document.activeElement?.id === 'search';
        const caret = typing ? document.activeElement.selectionStart : null;
        body.innerHTML = tabs + rest;
        wire();
        if (typing) {
          const box = body.querySelector('#search');
          box?.focus();
          box?.setSelectionRange(caret, caret);
        }
      }

      function wire() {
        for (const b of body.querySelectorAll('[data-tab]')) {
          b.onclick = () => {
            tab = b.dataset.tab;
            users = null;
            recent = null;
            render();
          };
        }
        for (const b of body.querySelectorAll('[data-filter]')) {
          b.onclick = () => {
            filter = b.dataset.filter;
            render();
          };
        }
        for (const b of body.querySelectorAll('[data-act]')) {
          b.onclick = () => answer(b.dataset.id, b.dataset.act);
        }
        for (const b of body.querySelectorAll('[data-admin]')) {
          b.onclick = () => setAdmin(b.dataset.admin, b.dataset.on === 'true');
        }
        for (const b of body.querySelectorAll('[data-gold]')) {
          b.onclick = () => setGold(b.dataset.gold);
        }
        for (const b of body.querySelectorAll('[data-open]')) {
          b.onclick = () => {
            opened = opened === b.dataset.open ? null : b.dataset.open;
            recent = null;
            render();
          };
        }
        for (const b of body.querySelectorAll('[data-page]')) {
          b.onclick = () => {
            page = Number(b.dataset.page);
            render();
          };
        }
        const search = body.querySelector('#search');
        if (search) {
          search.oninput = () => {
            query = search.value;
            page = 1;
            render();
          };
        }
      }

      async function usersView() {
        if (!users) {
          const { data, error } = await db.rpc('admin_users');
          if (error) return `<p class="error">${escape(error.message)}</p>`;
          users = data;
        }
        if (!users.length) return '<p class="empty">아직 아무도 없어요.</p>';

        const found = filterUsers(users, query);
        const cut = pageOf(found, page, PER_PAGE);
        page = cut.page;
        const searchHtml = `<div class="row" style="margin-bottom:12px">
          <input id="search" type="search" placeholder="이메일로 찾기" style="flex:1"
            value="${escape(query)}" />
          ${query.trim() ? `<span class="meta">${users.length}명 중 ${found.length}명</span>` : ''}
        </div>`;
        const pagerHtml =
          cut.pages > 1
            ? `<div class="row" style="justify-content:center;margin-top:12px">
                <button data-page="${cut.page - 1}" ${cut.page === 1 ? 'disabled' : ''}>이전</button>
                <span class="meta">${cut.page} / ${cut.pages}</span>
                <button data-page="${cut.page + 1}" ${cut.page === cut.pages ? 'disabled' : ''}>다음</button>
              </div>`
            : '';
        if (!found.length) return searchHtml + '<p class="empty">찾는 사람이 없어요.</p>';

        const day = (v) => (v ? new Date(v).toLocaleDateString('ko-KR') : '—');

        // Fetched only for the card that is open, so a hundred users is still
        // one query for the list and one for whoever is being looked at.
        let recentHtml = '';
        if (opened) {
          recent ??= await db.rpc('admin_user_recent', { target: opened, sessions: 5 });
          const { data: rows, error: recentError } = recent;
          // A missing function means the SQL has not been run, which is the
          // one cause worth naming: the raw message says what is absent and
          // nothing about what to do.
          recentHtml = recentError
            ? `<p class="error">${
                /Could not find the function/.test(recentError.message)
                  ? 'supabase/admin.sql을 다시 한 번 실행해 주세요.'
                  : escape(recentError.message)
              }</p>`
            : rows.length
              ? rows
                  .map(
                    (w) => `<div class="card" style="margin:10px 0 0">
                      <div class="row">
                        <span style="font-weight:700">${escape(w.title)}</span>
                        <span class="meta" style="margin-left:auto">${day(w.started_at)}</span>
                      </div>
                      <div class="meta">${escape(w.did)}</div>
                      ${
                        w.advice
                          ? `<div class="note">${escape(w.advice)}
                              <span class="tag">${w.advice_source === 'model' ? '모델' : '규칙'}</span>
                             </div>`
                          : '<div class="meta">조언 없음</div>'
                      }
                    </div>`
                  )
                  .join('')
              : '<p class="empty">마친 운동이 없어요.</p>';
        }

        return searchHtml + cut.rows
          .map(
            (u) => `<div class="card">
              <div class="row">
                <span class="name">${escape(u.email ?? '(이메일 없음)')}</span>
                ${u.admin ? '<span class="tag added">관리자</span>' : ''}
                <span class="meta" style="margin-left:auto">가입 ${day(u.joined)}</span>
              </div>
              <!--
                == null rather than === null: a field the database has not
                returned at all comes back undefined, and strict equality let
                it through to Number(undefined), which is how 「골드 NaN」
                appeared on screen the first time this ran against an older
                version of the function.
              -->
              <div class="meta">
                운동 ${u.workouts}회 · 마지막 ${day(u.last_workout)} ·
                골드 ${u.gold == null ? '아직 없음' : Number(u.gold).toLocaleString()}
              </div>
              <div class="row" style="margin-top:10px">
                <!--
                  Pre-filled with what they have, so the field reads as the
                  number it is about to become rather than as an amount to add.
                  Nothing is written until 저장 is pressed.
                -->
                <input
                  type="number"
                  min="0"
                  style="width:140px"
                  id="gold-${u.user_id}"
                  value="${u.gold ?? 0}"
                />
                <button data-gold="${u.user_id}">골드 저장</button>
                <button data-open="${u.user_id}">
                  ${opened === u.user_id ? '최근 운동 닫기' : '최근 운동 보기'}
                </button>
                <button data-admin="${u.user_id}" data-on="${!u.admin}" style="margin-left:auto">
                  ${u.admin ? '관리자에서 내리기' : '관리자로 올리기'}
                </button>
              </div>
              ${opened === u.user_id ? recentHtml : ''}
            </div>`
          )
          .join('') + pagerHtml;
      }

      async function setGold(target) {
        const raw = document.getElementById(`gold-${target}`)?.value;
        const amount = Number(raw);
        if (!Number.isInteger(amount) || amount < 0) {
          alert('0 이상의 숫자를 넣어 주세요.');
          return;
        }
        const { error } = await db.rpc('admin_set_gold', { target, amount });
        if (error) {
          alert(error.message);
          return;
        }
        users = null;
        await render();
      }

      async function setAdmin(target, on) {
        const { error } = await db.rpc('admin_set_admin', { target, make_admin: on });
        if (error) {
          alert(error.message);
          return;
        }
        users = null;
        await render();
      }

      function signIn() {
        body.innerHTML = `<div class="card">
          <label for="email">이메일</label>
          <input id="email" type="email" autocomplete="username" />
          <label for="pw" style="margin-top:10px">비밀번호</label>
          <input id="pw" type="password" autocomplete="current-password" />
          <p><button class="primary" id="go">로그인</button> <span id="msg" class="error"></span></p>
        </div>`;
        const go = document.getElementById('go');
        go.onclick = async () => {
          go.disabled = true;
          const { error } = await db.auth.signInWithPassword({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('pw').value,
          });
          if (error) {
            document.getElementById('msg').textContent = error.message;
            go.disabled = false;
            return;
          }
          location.reload();
        };
      }

      async function requestsView() {
        const query = db
          .from('exercise_requests')
          .select('*')
          .order('created_at', { ascending: false });
        if (filter !== 'all') query.eq('status', filter);

        const { data, error } = await query;
        if (error) return `<p class="error">${escape(error.message)}</p>`;

        const chips = ['new', 'seen', 'added', 'declined', 'all']
          .map(
            (s) =>
              `<button data-filter="${s}" aria-pressed="${s === filter}">${
                s === 'all' ? '전체' : STATUS[s]
              }</button>`
          )
          .join(' ');

        const cards = data.length
          ? data.map(card).join('')
          : '<p class="empty">여기엔 아무것도 없어요.</p>';

        return `<div class="row filters">${chips}</div>${cards}`;
      }

      function card(r) {
        const guesses = [r.muscle_group, r.equipment].filter(Boolean).join(' · ');
        return `<div class="card">
          <div class="row">
            <span class="name">${escape(r.name)}</span>
            ${guesses ? `<span class="tag">${escape(guesses)}</span>` : ''}
            <span class="tag ${r.status}">${STATUS[r.status] ?? escape(r.status)}</span>
            <span class="meta" style="margin-left:auto">${new Date(r.created_at).toLocaleDateString('ko-KR')}</span>
          </div>
          ${r.note ? `<div class="note">${escape(r.note)}</div>` : ''}
          ${r.reply ? `<div class="note meta">답: ${escape(r.reply)}</div>` : ''}
          <div class="row" style="margin-top:10px">
            <input class="grow" id="reply-${r.id}" placeholder="답 한마디 (그대로 보여요)" value="${escape(r.reply ?? '')}" />
            <button data-act="seen" data-id="${r.id}">읽음</button>
            <button class="primary" data-act="added" data-id="${r.id}">넣었음</button>
            <button data-act="declined" data-id="${r.id}">안 넣음</button>
          </div>
        </div>`;
      }

      async function answer(id, status) {
        const reply = document.getElementById(`reply-${id}`)?.value.trim() || null;
        const { error } = await db
          .from('exercise_requests')
          .update({ status, reply, handled_at: new Date().toISOString() })
          .eq('id', id);
        if (error) {
          alert(error.message);
          return;
        }
        await render();
      }

      start();
      }
    </script>
  </body>
</html>
